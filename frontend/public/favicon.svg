<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    
    <!-- Message Bubble Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rounded Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>

  <!-- Sleek Message Bubble Base -->
  <g filter="url(#glow)">
    <path d="M 128,128 C 128,92.65 156.65,64 192,64 L 320,64 C 355.35,64 384,92.65 384,128 L 384,288 C 384,323.35 355.35,352 320,352 L 248,352 L 160,424 L 176,352 L 192,352 C 156.65,352 128,323.35 128,288 Z" fill="url(#primary-grad)"/>
  </g>

  <!-- High-Tech Lightning / SMS Signal Cutout -->
  <path d="M 272,112 L 192,232 L 256,232 L 240,320 L 320,200 L 256,200 Z" fill="#ffffff"/>
</svg>